variables:
  DOCKER_REPOSITORY: mendersoftware/mender-ci-tools
  MULTIPLATFORM_BUILD: "true"
  MULTIPLATFORM_PLATFORMS: "linux/amd64,linux/arm64"
  DOCKER_HOST:
    value: 'tcp://docker:2376'
    description: "Required to run dind inside k8s runners with TLS"
  DOCKER_TLS_CERTDIR:
    value: '/certs'
    description: "The cert dir inside the gitlab runner. Don't change this."
  DOCKER_TLS_VERIFY:
    value: 1
    description: "Enable TLS verification for docker in dind"
  DOCKER_CERT_PATH:
    value: "$DOCKER_TLS_CERTDIR/client"
    description: "Used for docker entrypoints. See https://gitlab.com/gitlab-org/gitlab-runner/-/issues/4125"

stages:
  - test
  - build
  - publish

include:
  - component: gitlab.com/Northern.tech/Mender/mendertesting/commit-lint@master
  - project: 'Northern.tech/Mender/mendertesting'
    file:
      - '.gitlab-ci-check-license.yml'
      - '.gitlab-ci-check-docker-build.yml'
      - '.gitlab-ci-check-docker-release-indep.yml'
      - '.gitlab-ci-github-status-updates.yml'

# excludes non multiplatform build job
build:docker:
  rules:
    - when: never

# excludes non multiplatform build job
publish:image:
  rules:
    - when: never

# docker-release-indep only patches publish:image's rules for release-candidate tags;
# carry that rule over so RC tags keep publishing now that publish:image is disabled.
publish:image-multiplatform:
  rules:
    - if: $MULTIPLATFORM_BUILD != "true"
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^(main|master|staging|production|feature-.+|v?\d+\.\d+\.x)$/'
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+\-build[0-9]+$/'

# docker-release-indep's publish:image:final-tag used docker pull/tag/push, which only
# handles the runner's own platform and would collapse the final release tag to
# single-arch. regctl image copy preserves the multi-arch manifest list instead.
publish:image:final-tag:
  image: "registry.gitlab.com/northern.tech/mender/mender-test-containers/docker-multiplatform-buildx:master"
  before_script:
    - 'docker login -u "$REGISTRY_MENDER_IO_USERNAME" -p "$REGISTRY_MENDER_IO_PASSWORD" registry.mender.io || echo "Warning: registry.mender.io credentials unavailable or invalid"'
    - 'docker login -u "$DOCKER_HUB_USERNAME" -p "$DOCKER_HUB_PASSWORD" || echo "Warning: Docker credentials unavailable or invalid"'
    - apk add --no-cache git
  script:
    - last_release_candidate=$(git tag --contains ${CI_COMMIT_SHA} | sort -t 'd' -k 2,2n | tail -n 1)
    - regctl image copy $DOCKER_REPOSITORY:$last_release_candidate $DOCKER_REPOSITORY:${CI_COMMIT_REF_NAME}

.trigger:update-dependencies:mender-docs-site:
  inherit:
    variables: false
  trigger:
    project: Northern.tech/Mender/mender-docs-site
    branch: master

trigger:update-dependencies:mender-docs-site:tag:
  # We keep this job in .pre so it can be run regardless of the rest of the pipeline failing
  stage: .pre
  extends: .trigger:update-dependencies:mender-docs-site
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    MENDER_CI_WORKFLOWS_VERSION: "$CI_COMMIT_TAG"

trigger:update-dependencies:mender-docs-site:manual:
  # For the manual run, the user needs to set MENDER_CI_WORKFLOWS_VERSION
  stage: publish
  extends: .trigger:update-dependencies:mender-docs-site
  when: manual
  variables:
    MENDER_CI_WORKFLOWS_VERSION: "$MENDER_CI_WORKFLOWS_VERSION"

.update-dependencies:
  # It will run either on a parent trigger or manually
  stage: publish
  variables:
    # Variables to be set by the parent pipeline
    MENDER_CLI_VERSION: ""
    MENDER_ARTIFACT_VERSION: ""
    MENDER_CLIENT_VERSION: ""
  image: debian:13-slim
  before_script:
    # Install and setup hub
    - apt-get update && apt-get install -qqy hub
    - export GITHUB_TOKEN="$GITHUB_BOT_TOKEN_REPO_FULL"
    # Prepare SSH key
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    # Configure git
    - git config --global user.email "mender@northern.tech"
    - git config --global user.name "Mender Test Bot"
    # Prepare workspace
    - hub clone mendersoftware/${CI_PROJECT_NAME} /tmp/${CI_PROJECT_NAME}
    - cd /tmp/${CI_PROJECT_NAME}
    - git checkout -b update-dependencies-$(date +%s)
  script:
    # Update dependencies
    - 'changelog_entries=""'
    - if [ -n "$MENDER_CLI_VERSION" ]; then
    -   sed -i Dockerfile -e "s/MENDER_CLI_VERSION=.*/MENDER_CLI_VERSION=$MENDER_CLI_VERSION/"
    -   'changelog_entries="${changelog_entries} --message \"Changelog: Update MENDER_CLI_VERSION to $MENDER_CLI_VERSION\""'
    - fi
    - if [ -n "$MENDER_ARTIFACT_VERSION" ]; then
    -   sed -i Dockerfile -e "s/MENDER_ARTIFACT_VERSION=.*/MENDER_ARTIFACT_VERSION=$MENDER_ARTIFACT_VERSION/"
    -   'changelog_entries="${changelog_entries} --message \"Changelog: MENDER_ARTIFACT_VERSION to $MENDER_ARTIFACT_VERSION\""'
    - fi
    - if [ -n "$MENDER_CLIENT_VERSION" ]; then
    -   sed -i Dockerfile -e "s/MENDER_CLIENT_VERSION=.*/MENDER_CLIENT_VERSION=$MENDER_CLIENT_VERSION/"
    -   'changelog_entries="${changelog_entries} --message \"Changelog: MENDER_CLIENT_VERSION to $MENDER_CLIENT_VERSION\""'
    - fi
    # Create pull request
    - if ! git diff-index --quiet HEAD; then
    -   git add Dockerfile
    -   'eval git commit --signoff --message \"feat: Update dependencies\" ${changelog_entries} --message \"Ticket: None\"'
    -   hub pull-request --push --base mendersoftware:master --message "Update dependencies"
    - fi

update-dependencies:parent:
  extends: .update-dependencies
  rules:
    # CI_PIPELINE_SOURCE is 'pipeline' for multi-project pipelines. See:
    # https://docs.gitlab.com/ee/ci/pipelines/downstream_pipelines.html#use-rules-to-control-downstream-pipeline-jobs
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'

update-dependencies:manual:
  extends: .update-dependencies
  when: manual
